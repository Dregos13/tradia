name: CI

on:
  push:
    branches:
      - main
      - 'orquesta/**'
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      # Los instaladores salen sin firmar: no se buscan certificados en el runner.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

      # Tradia nunca guarda claves sin cifrar: en Linux exige un llavero
      # (safeStorage rechaza el backend 'basic_text'). El runner no trae
      # ninguno, así que se arranca gnome-keyring desbloqueado en una sesión
      # D-Bus y se le dice a Chromium que use libsecret.
      - name: Llavero para las pruebas (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-1-0 dbus-x11

      - name: Pruebas de extremo a extremo (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- bash -c '
            echo -n "tradia-ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            xvfb-run -a npm run test:e2e
          '

      - name: Empaquetar instaladores
        run: npm run dist

      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: tradia-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
